plugins {
    alias(libs.plugins.moddevgradle.legacy)
    alias(libs.plugins.fabric.loom.repositories)
}

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    dependencyScope("localRuntime") {
        runtimeClasspath.extendsFrom(it)
    }
    dependencyScope("merge")
    resolvable("mergeFiles") {
        extendsFrom(merge)
    }
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    compileOnly project(":Common")
    compileOnly project(":Forge:Origins-Fabric-Compat")
    compileOnly project(path: ":Forge:Origins-Fabric-Deobf", configuration: "modRuntimeClasspathMainMapped")

    annotationProcessor variantOf(libs.mixin) { classifier 'processor' }
    annotationProcessor libs.mixinextras.common

    modImplementation libs.icarus.forge
    modImplementation libs.curios.forge
    modImplementation libs.caelus.forge
    modImplementation libs.resourcefulconfig.forge
    modImplementation libs.commonnetworking.forge

    modImplementation libs.bundles.origins.forge

    compileOnly libs.mixinextras.common
    modImplementation libs.mixinextras.forge

    modCompileOnly libs.connector

    merge(project(path: ":Forge:Origins-Fabric-Compat", configuration: "export"))
}

legacyForge {
    version = "${libs.versions.minecraft.get()}-${libs.versions.forge.get()}"

    parchment {
        minecraftVersion = libs.versions.parchment.minecraft.get()
        mappingsVersion = libs.versions.parchment.mappings.get()
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'forge.logging.console.level', 'debug'

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            gameDirectory = project.file('run')
        }

        client {
            client()

            if (rootProject.hasProperty('mc_uuid')) {
                programArgument "--uuid=${rootProject.mc_uuid}"
            }

            if (rootProject.hasProperty('mc_username')) {
                programArgument "--username=${rootProject.mc_username}"
            }

            if (rootProject.hasProperty('mc_java_agent_path')) {
                jvmArgument "-javaagent:${rootProject.mc_java_agent_path}"
            }
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(":Common").sourceSets.main)
            sourceSet(project(":Forge:Origins-Fabric-Compat").sourceSets.main)
        }
    }
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    add(project(":Forge:Origins-Fabric-Compat").sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.forge.mixins.json")
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.forge.mixins.json"
    ])

    from(zipTree(configurations.mergeFiles.singleFile)) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    dependsOn(configurations.mergeFiles)
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named("compileJava", JavaCompile) {
    source(project(":Common").sourceSets.main.allJava)
}

tasks.named("javadoc", Javadoc) {
    source(project(":Common").sourceSets.main.allJava)
    source(project(":Forge:Origins-Fabric-Compat").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
    from(project(":Forge:Origins-Fabric-Compat").sourceSets.main.allSource)
}

processResources {
    from project(":Common").sourceSets.main.resources
}
