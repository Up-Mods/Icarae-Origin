[versions]
# The latest versions are available at https://fabricmc.net/develop/
loom = "1.10.1"

minecraft = "1.21.1"

# The latest versions are available at https://parchmentmc.org/docs/getting-started
parchment_minecraft = "1.21.1"
parchment_mappings = "2024.11.17"

fabric_loader = "0.16.10"
fabric_api = "0.115.0+1.21.1"

jetbrains_annotations = "26.0.2"

icarus = "4.3.1"
sparkweave = "0.507.0"
commonnetworking = "1.0.18-1.21.1"
resourcefulconfig = "3.0.9"
trinkets = "3.10.0"

origins = "1.13.0-alpha.12+mc.1.21.1"
apoli = "2.12.0-alpha.15+mc.1.21.1"
cloth = "13.0.121"
cca = "6.1.2"

emi = "1.1.20+1.21.1"

modmenu = "11.0.3"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

jetbrains_annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains_annotations" }

fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }

fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }

icarus = { module = "dev.cammiescorner.icarus:Icarus-Fabric", version.ref = "icarus" }
sparkweave = { module = "dev.upcraft.sparkweave:Sparkweave-Fabric", version.ref = "sparkweave" }
commonnetworking = { module = "mysticdrew:common-networking-fabric", version.ref = "commonnetworking" }
resourcefulconfig = { module = "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.21", version.ref = "resourcefulconfig" }
trinkets = { module = "dev.emi:trinkets", version.ref = "trinkets" }

origins = { module = "io.github.apace100:origins-fabric", version.ref = "origins" }
apoli = { module = "io.github.apace100:apoli", version.ref = "apoli" }
cloth = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "cloth" }
cca-base = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-base", version.ref = "cca" }
cca-entity = { module = "dev.onyxstudios.cardinal-components-api:cardinal-components-entity", version.ref = "cca" }

emi = { module = "dev.emi:emi-fabric", version.ref = "emi" }

modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }

[bundles]
icarus = ["icarus", "sparkweave", "commonnetworking", "resourcefulconfig", "trinkets", "cca-base", "cca-entity"]
origins = ["origins", "apoli", "cloth", "cca-base", "cca-entity"]

[plugins]
loom = { id = "fabric-loom", version.ref = "loom" }
